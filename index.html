<!DOCTYPE html>
<html lang="ko">
<head>

<title>S&P 500 히트맵 | Herdvibe</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --text-primary: #ffffff;
    --text-secondary: #888888;
    --text-muted: #555555;
    --accent-green: #00d4aa;
    --accent-red: #ff4757;
    --accent-yellow: #ffd43b;
    --border-color: #2a2a2a;
  }

  html, body { overflow-x: hidden; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  /* ===== INDEX TAB BAR ===== */
  .index-tab-bar {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 12px 0 0;
    margin-bottom: 0;
  }
  .index-tab {
    padding: 10px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
    position: relative;
  }
  .index-tab:hover {
    color: var(--text-secondary);
  }
  .index-tab.active {
    color: var(--accent-yellow);
    border-bottom-color: var(--accent-yellow);
  }
  .index-tab .tab-badge {
    display: inline-block;
    font-size: 0.55rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 4px;
    vertical-align: super;
  }
  .index-tab.active .tab-badge {
    color: var(--accent-yellow);
    opacity: 0.7;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 20px 0 20px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    color: var(--text-primary);
  }
  .header .subtitle {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }

  /* ===== CONTROLS BAR ===== */
  .controls-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .period-toggle {
    display: flex;
    background: var(--bg-secondary);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    overflow: hidden;
  }
  .period-btn {
    padding: 8px 16px;
    font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    background: transparent;
    color: var(--text-secondary);
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .period-btn.active {
    background: var(--accent-yellow);
    color: #000;
    font-weight: 700;
  }
  .period-btn:hover:not(.active) {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  /* Share Buttons */
  .share-group { display: flex; gap: 6px; }
  .share-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    padding: 0;
  }
  .share-btn:hover { background: var(--bg-tertiary); border-color: #3a3a3a; }
  .share-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .share-btn.twitter:hover { color: #1da1f2; border-color: #1da1f2; }
  .share-btn.kakao:hover { color: #fee500; border-color: #fee500; }
  .share-btn.telegram:hover { color: #0088cc; border-color: #0088cc; }
  .share-btn.instagram:hover { color: #e4405f; border-color: #e4405f; }
  .share-btn.link-copy:hover { color: var(--accent-yellow); border-color: var(--accent-yellow); }

  /* ===== CATEGORY FILTER ===== */
  .category-filter {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .cat-btn {
    padding: 6px 14px;
    font-size: 0.7rem;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .cat-btn.active {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-color: var(--accent-yellow);
    box-shadow: 0 0 10px rgba(255,212,59,0.1);
  }
  .cat-btn:hover:not(.active) { border-color: #3a3a3a; }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 12px 20px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .stat-item span { font-weight: 700; }
  .stat-green { color: var(--accent-green); }
  .stat-red { color: var(--accent-red); }
  .stat-yellow { color: var(--accent-yellow); }

  /* ===== LEGEND ===== */
  .legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 8px 20px;
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .legend-block { width: 24px; height: 12px; border-radius: 2px; }
  .legend-label { margin: 0 8px 0 2px; }

  /* ===== TREEMAP ===== */
  .treemap-container { padding: 4px 8px 16px; width: 100%; }
  .treemap { width: 100%; position: relative; min-height: 650px; }

  .tree-cell {
    position: absolute;
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid rgba(0,0,0,0.4);
    animation: cellFade 0.3s ease forwards;
    opacity: 0;
  }
  .tree-cell:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    z-index: 100;
  }
  @keyframes cellFade { to { opacity: 1; } }

  .cell-inner {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4px;
    overflow: hidden;
  }
  .cell-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1.1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    text-align: center;
  }
  .cell-name {
    font-size: 9px; opacity: 0.7; font-weight: 400;
    line-height: 1.1; text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%;
  }
  .cell-change {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; line-height: 1.2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    text-align: center;
  }

  .size-xl .cell-symbol { font-size: 20px; }
  .size-xl .cell-change { font-size: 22px; }
  .size-xl .cell-name { font-size: 12px; }
  .size-lg .cell-symbol { font-size: 15px; }
  .size-lg .cell-change { font-size: 16px; }
  .size-lg .cell-name { font-size: 10px; }
  .size-md .cell-symbol { font-size: 12px; }
  .size-md .cell-change { font-size: 13px; }
  .size-md .cell-name { font-size: 9px; }
  .size-sm .cell-symbol { font-size: 10px; }
  .size-sm .cell-change { font-size: 10px; }
  .size-sm .cell-name { display: none; }
  .size-xs .cell-symbol { font-size: 8px; }
  .size-xs .cell-change { font-size: 8px; }
  .size-xs .cell-name { display: none; }

  /* ===== TOOLTIP ===== */
  .tooltip {
    position: fixed;
    background: rgba(26,26,26,0.97);
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.15s;
    min-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }
  .tooltip.show { opacity: 1; }
  .tooltip-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid #2a2a2a;
  }
  .tooltip-name { font-weight: 700; font-size: 14px; }
  .tooltip-symbol { color: var(--text-secondary); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .tooltip-row {
    display: flex; justify-content: space-between; margin: 5px 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .tooltip-label { color: var(--text-secondary); font-size: 11px; }
  .tooltip-value { font-weight: 600; font-size: 11px; }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 0.75rem;
  }

  /* ===== LOADING ===== */
  .loading-overlay {
    display: flex; align-items: center; justify-content: center;
    min-height: 400px; flex-direction: column; gap: 16px;
  }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--border-color);
    border-top-color: var(--accent-yellow);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 0.8rem; color: var(--text-secondary); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 0.8rem;
    border: 1px solid var(--border-color);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 2000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .container { padding: 12px; }
    .index-tab { padding: 8px 18px; font-size: 0.75rem; }
    .index-tab .tab-badge { font-size: 0.5rem; }
    .header { padding: 15px 0 15px; margin-bottom: 15px; }
    .header h1 { font-size: 1.4rem; }
    .header .subtitle { font-size: 0.75rem; }
    .controls-bar { gap: 10px; }
    .period-btn { padding: 6px 12px; font-size: 0.7rem; }
    .share-btn { width: 30px; height: 30px; }
    .share-btn svg { width: 14px; height: 14px; }
    .treemap-container { padding: 2px 4px 12px; }
    .stats-bar { padding: 10px 12px; gap: 12px; font-size: 0.65rem; }
    .legend { padding: 6px 12px; font-size: 0.6rem; }
    .cat-btn { padding: 5px 10px; font-size: 0.6rem; }
  }
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .header h1 { font-size: 1.2rem; }
    .index-tab { padding: 7px 14px; font-size: 0.7rem; }
    .period-btn { padding: 5px 10px; font-size: 0.65rem; }
  }
</style>
</head>

// ===== TREEMAP LAYOUT =====
function squarify(items, x, y, w, h) {
  if (!items.length) return [];
  if (items.length === 1) { items[0].x=x; items[0].y=y; items[0].w=w; items[0].h=h; return items; }
  const total = items.reduce((s,i) => s+i.value, 0);
  if (!total) return items;
  const rects = [];
  layoutRow(items, 0, x, y, w, h, total, rects);
  return rects;
}
function layoutRow(items, si, x, y, w, h, ta, rects) {
  if (si >= items.length) return;
  const vert = w >= h;
  const rem = items.slice(si);
  const rt = rem.reduce((s,i) => s+i.value, 0);
  let row = [rem[0]], rs = rem[0].value;
  let best = worstRatio(row, rs, vert?h:w, rt, w, h);
  for (let i=1; i<rem.length; i++) {
    const tr = [...row, rem[i]], ts = rs + rem[i].value;
    const r = worstRatio(tr, ts, vert?h:w, rt, w, h);
    if (r <= best) { row=tr; rs=ts; best=r; } else break;
  }
  const frac = rs / rt;
  if (vert) {
    const rw = w * frac; let cy = y;
    for (const it of row) { const ih = (it.value/rs)*h; it.x=x; it.y=cy; it.w=rw; it.h=ih; rects.push(it); cy+=ih; }
    layoutRow(items, si+row.length, x+rw, y, w-rw, h, ta, rects);
  } else {
    const rh = h * frac; let cx = x;
    for (const it of row) { const iw = (it.value/rs)*w; it.x=cx; it.y=y; it.w=iw; it.h=rh; rects.push(it); cx+=iw; }
    layoutRow(items, si+row.length, x, y+rh, w, h-rh, ta, rects);
  }
}
function worstRatio(row, rs, sl, ta, W, H) {
  const vert = W>=H;
  const rsz = (vert?W:H) * (rs/ta);
  if (!rsz) return Infinity;
  let worst = 0;
  for (const it of row) {
    const il = (it.value/rs) * (vert?H:W);
    const r = Math.max(rsz/il, il/rsz);
    if (r > worst) worst = r;
  }
  return worst;
}

function getStockSector(symbol) {
  const cfg = INDEX_CONFIG[currentIndex];
  for (const [s,syms] of Object.entries(cfg.sectors)) if (syms.includes(symbol)) return s;
  return 'Other';
}
function formatMcap(n) { if(n>=1e12) return `$${(n/1e12).toFixed(2)}T`; if(n>=1e9) return `$${(n/1e9).toFixed(1)}B`; if(n>=1e6) return `$${(n/1e6).toFixed(1)}M`; return `$${n.toLocaleString()}`; }
function formatPrice(n) { if(n>=1000) return `$${n.toLocaleString(undefined,{maximumFractionDigits:0})}`; if(n>=1) return `$${n.toFixed(2)}`; return `$${n.toFixed(4)}`; }
function formatVol(n) { if(n>=1e9) return `$${(n/1e9).toFixed(1)}B`; if(n>=1e6) return `${(n/1e6).toFixed(0)}M`; return `${(n/1e3).toFixed(0)}K`; }
function getChange(stock) { if(currentPeriod==='5d') return stock.price_change_5d||0; if(currentPeriod==='1mo') return stock.price_change_1mo||0; return stock.price_change_1d||0; }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

// ===== RENDER =====
function renderTreemap(data) {
  const ct = document.getElementById('treemap');
  const cw = ct.clientWidth;
  let ch;
  const isMobile = window.innerWidth <= 480;
  const isTablet = window.innerWidth <= 768 && !isMobile;
  if (currentIndex === 'dia') { ch = isMobile ? 650 : isTablet ? 550 : 500; }
  else { ch = isMobile ? 920 : isTablet ? 780 : 650; }
  ct.style.height = ch+'px';
  let f = [...data];
  const cfg = INDEX_CONFIG[currentIndex];
  if (currentCategory !== 'all') { const ci = cfg.sectors[currentCategory]||[]; f = f.filter(c => ci.includes(c.symbol)); }
  f.sort((a,b) => b.market_cap-a.market_cap);
  updateStats(f);
  const items = f.map(c => ({...c, value:Math.sqrt(c.market_cap), change:getChange(c), sectorName:getStockSector(c.symbol)}));
  const GAP=2, laid = squarify([...items], 0, 0, cw, ch);
  ct.innerHTML = '';
  laid.forEach((it, idx) => {
    const el = document.createElement('div');
    el.className = 'tree-cell';
    const w=Math.max(0,it.w-GAP), h=Math.max(0,it.h-GAP), area=w*h;
    let sc='size-xs';
    if(area>40000) sc='size-xl'; else if(area>15000) sc='size-lg'; else if(area>5000) sc='size-md'; else if(area>1500) sc='size-sm';
    el.classList.add(sc);
    const chg=it.change, sign=chg>=0?'+':'';
    el.style.cssText = `left:${it.x+GAP/2}px;top:${it.y+GAP/2}px;width:${w}px;height:${h}px;background:${getChangeColor(chg)};color:${getTextColor(chg)};animation-delay:${idx*4}ms;`;
    el.innerHTML = `<div class="cell-inner"><div class="cell-symbol">${it.symbol}</div><div class="cell-name">${it.name}</div><div class="cell-change" style="color:${getChangeTextColor(chg)}">${sign}${chg.toFixed(1)}%</div></div>`;
    el.addEventListener('mouseenter', e => showTooltip(e, it));
    el.addEventListener('mousemove', e => moveTooltip(e));
    el.addEventListener('mouseleave', hideTooltip);
    ct.appendChild(el);
  });
}

function updateStats(data) {
  const g=data.filter(c=>getChange(c)>0).length, l=data.filter(c=>getChange(c)<0).length;
  const avg=data.reduce((s,c)=>s+getChange(c),0)/(data.length||1);
  document.getElementById('totalStocks').textContent=data.length;
  document.getElementById('gainCount').textContent=g;
  document.getElementById('lossCount').textContent=l;
  const ae=document.getElementById('avgChange');
  ae.textContent=`${avg>=0?'+':''}${avg.toFixed(2)}%`;
  ae.className=avg>=0?'stat-green':'stat-red';
}

function showTooltip(e, stock) {
  const tt=document.getElementById('tooltip');
  const c1d=stock.price_change_1d||0, c5d=stock.price_change_5d||0, c1mo=stock.price_change_1mo||0;
  const clr=v=>v>=0?'#69f0ae':'#ff8a80';
  const sgn=v=>v>=0?'+':'';
  const sectorLabel = SECTOR_LABELS[stock.sectorName] || stock.sectorName;
  tt.innerHTML=`<div class="tooltip-header"><div><div class="tooltip-name">${stock.name}</div><div class="tooltip-symbol">${stock.symbol} · ${sectorLabel}</div></div></div><div class="tooltip-row"><span class="tooltip-label">가격</span><span class="tooltip-value">${formatPrice(stock.current_price)}</span></div><div class="tooltip-row"><span class="tooltip-label">시가총액</span><span class="tooltip-value">${formatMcap(stock.market_cap)}</span></div><div class="tooltip-row"><span class="tooltip-label">거래량</span><span class="tooltip-value">${formatVol(stock.total_volume||0)}</span></div><div class="tooltip-row"><span class="tooltip-label">1D</span><span class="tooltip-value" style="color:${clr(c1d)}">${sgn(c1d)}${c1d.toFixed(2)}%</span></div><div class="tooltip-row"><span class="tooltip-label">1W</span><span class="tooltip-value" style="color:${clr(c5d)}">${sgn(c5d)}${c5d.toFixed(2)}%</span></div><div class="tooltip-row"><span class="tooltip-label">1M</span><span class="tooltip-value" style="color:${clr(c1mo)}">${sgn(c1mo)}${c1mo.toFixed(2)}%</span></div>`;
  tt.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  const tt=document.getElementById('tooltip'), p=16;
  let x=e.clientX+p, y=e.clientY+p;
  const r=tt.getBoundingClientRect();
  if(x+r.width>window.innerWidth) x=e.clientX-r.width-p;
  if(y+r.height>window.innerHeight) y=e.clientY-r.height-p;
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('show'); }

// ===== LOAD =====
async function loadData(idx) {
  idx = idx || currentIndex;
  const cfg = INDEX_CONFIG[idx];
  const loadEl = document.getElementById('loading');
  if (!loadEl) {
    // 이미 로딩 완료된 상태에서 탭 전환 시 임시 로딩
    const ct = document.getElementById('treemap');
    ct.innerHTML = '<div class="loading-overlay" id="loading"><div class="spinner"></div><div class="loading-text">Loading market data...</div></div>';
  }
  try {
    const r = await fetch(cfg.dataUrl);
    if(r.ok) {
      const data = await r.json();
      dataCache[idx] = data;
      if (idx === currentIndex) { allData = data; }
    }
    else throw new Error('not found');
  } catch(e) {
    console.log(`Using mock data for ${idx}:`, e.message);
    const mock = generateMockData(idx);
    dataCache[idx] = mock;
    if (idx === currentIndex) { allData = mock; }
  }
  const ld = document.getElementById('loading');
  if (ld) ld.remove();
  const n = new Date();
  document.getElementById('dataTimestamp').textContent = `${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')} 기준`;
  if (idx === currentIndex) renderTreemap(allData);
  if(typeof sendHeight==='function') setTimeout(sendHeight,200);
}

/* iframe resize */
var _lastH=0,_ht,_frameId='hvHeatmap';
function sendHeight(){clearTimeout(_ht);_ht=setTimeout(function(){var h=document.body.scrollHeight;if(Math.abs(h-_lastH)>5){_lastH=h;try{window.parent.postMessage({type:'resize',height:h,id:_frameId},'*');window.parent.postMessage({height:h,id:_frameId},'*');}catch(e){}}},150);}
window.addEventListener('resize',sendHeight);window.addEventListener('load',function(){sendHeight();setTimeout(sendHeight,500);setTimeout(sendHeight,1500);});
new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true});setInterval(sendHeight,2000);

setupCategoryFilter();
loadData();
